
name: Build FOX ANGEL APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FOX ANGEL APK
        run: gradle :application:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOX-ANGEL-debug-apk
          path: application/build/outputs/apk/debug/application-debug.apk
